version: 3
allow:
  depOnAnyVendor: false
  deepScan: false
components:
  main:
    in: .
  proxy:
    in: internal/proxy
  protocol:
    in: internal/protocol
  history:
    in: internal/history
  config:
    in: internal/config
  anthropic:
    in: internal/anthropic
  facet:
    in: internal/facet
  tools:
    in: internal/tools
  # Live-smoke driver for RunLoop (F3b caveat): runs the tool-loop against the
  # real Messages API. A hack/ entrypoint, so it wires the client + builtins
  # the same way main does.
  loopsmoke:
    in: hack/loopsmoke
deps:
  main:
    mayDependOn:
      - proxy
      - facet
      - config
      - anthropic
  # proxy calls facets only through its own Interceptor interface (wired by
  # main); it must never import facet — the reverse direction is the rule.
  proxy:
    mayDependOn:
      - protocol
      - history
  facet:
    mayDependOn:
      - protocol
      - anthropic
      # The superego consumes the canonical history read-only (its context
      # is assembled from the history snapshot the proxy hands over).
      - history
  history:
    mayDependOn:
      - protocol
  # Native tool-use builtins + the tool-loop runner/dispatcher. The bash/fs
  # executors are provider-agnostic (plain *Input in, (string,bool) out); the
  # only internal coupling is the dispatcher/loop driving the anthropic client
  # and declaring ToolDefs — the same sanctioned concrete dependency facet has.
  tools:
    mayDependOn:
      - anthropic
  loopsmoke:
    mayDependOn:
      - anthropic
      - tools
